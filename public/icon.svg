<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="peak" x1="256" y1="100" x2="256" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.65"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <ellipse cx="256" cy="80" rx="180" ry="75" fill="rgba(165,180,252,0.12)"/>

  <!-- Mountain outer -->
  <path d="M102 400 L256 140 L410 400" stroke="url(#peak)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mountain inner ridge -->
  <path d="M180 332 L256 185 L332 332" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.3"/>

  <!-- Gold peak dot -->
  <circle cx="256" cy="128" r="38" fill="#fbbf24" opacity="0.9"/>
  <circle cx="256" cy="128" r="23" fill="#fde68a"/>
</svg>
