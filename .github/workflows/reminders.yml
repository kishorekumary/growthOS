# Drives /api/cron/reminders every 15 minutes. Vercel Hobby crons run at most
# once a day, which is too coarse for user-chosen reminder times. The route
# only sends what fell due in the last hour, so GitHub's occasional schedule
# delays (or a skipped run) never cause duplicates.
#
# Requires repo secrets: APP_URL (e.g. https://your-app.vercel.app, no
# trailing slash) and CRON_SECRET (same value as the Vercel env var).
name: Reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call reminders endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the APP_URL and CRON_SECRET repository secrets"
            exit 1
          fi
          curl --fail-with-body -sS --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/reminders"
